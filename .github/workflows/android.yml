
name: Extract ZIP & Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP
        run: |
          test -f StreamPlus-complete-v5-fixed.zip || {
            echo "ERROR: ZIP tidak ditemukan!"
            exit 1
          }

      - name: Extract ZIP
        run: |
          mkdir -p extracted_project
          unzip -o StreamPlus-complete-v5-fixed.zip -d extracted_project
          echo "Isi folder hasil ekstrak:"
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Check Gradle project
        working-directory: extracted_project/_src
        run: |
          ls -la
          test -f settings.gradle -o -f settings.gradle.kts
          test -f gradlew

      - name: Build Debug APK
        working-directory: extracted_project/_src
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f extracted_project/_src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh extracted_project/_src/app/build/outputs/apk/debug/

      - name: Upload StreamPlus APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlus-v5-debug-apk
          path: extracted_project/_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
