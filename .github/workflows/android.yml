
name: Extract ZIP & Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP in repository root
        shell: bash
        run: |
          mapfile -t ZIP_FILES < <(
            find . -maxdepth 1 -type f -iname "*.zip"
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "ERROR: Tidak ada file ZIP di root repository!"
            ls -lah
            exit 1
          fi

          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "ERROR: Ditemukan lebih dari satu ZIP:"
            printf '%s\n' "${ZIP_FILES[@]}"
            echo "Sisakan satu ZIP atau tentukan nama file secara manual."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILES[0]}"
          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir -p extracted_project
          unzip -o "$ZIP_FILE" -d extracted_project

          echo "Isi folder hasil ekstrak:"
          find extracted_project -maxdepth 3 -type f | head -100

      - name: Find Android Gradle project
        shell: bash
        run: |
          GRADLEW=$(find extracted_project -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project Android: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "APK berhasil dibuat:"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlus-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
