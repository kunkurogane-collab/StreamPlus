name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: "_src/**/*.gradle*"

      - name: Set up Gradle CLI & Wrapper JAR
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: _src
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.13 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPlus-APK
          path: |
            _src/app/build/outputs/apk/release/*.apk
            _src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
