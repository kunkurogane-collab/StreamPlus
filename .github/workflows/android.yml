   name: Extract ZIP & Build APK

   on:
     push:
       branches: [ main, master ]
     workflow_dispatch:

   jobs:
     build:
       runs-on: ubuntu-latest

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Extract StreamPlus ZIP
           run: |
             unzip -o StreamPlus-complete-v5-fixed.zip -d extracted_project

         - name: Set up JDK 17
           uses: actions/setup-java@v4
           with:
             java-version: '17'
             distribution: 'temurin'

         - name: Setup Gradle 8.4
           uses: gradle/actions/setup-gradle@v3
           with:
             gradle-version: '8.4'

         - name: Build Debug APK
           working-directory: extracted_project/_src
           run: gradle assembleDebug --stacktrace

         - name: Upload StreamPlus APK Artifact
           uses: actions/upload-artifact@v4
           with:
             name: StreamPlus-v5-debug-apk
             path: extracted_project/_src/app/build/outputs/apk/debug/app-debug.apk
   
